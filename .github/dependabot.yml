version: 2
updates:
  # The collector release line is bumped by hand, all together, in one PR
  # (AGENTS.md "Versions move together"); Dependabot proposes the rest.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: go.opentelemetry.io/collector*
      - dependency-name: github.com/open-telemetry/opentelemetry-collector-contrib*
      # 1.84.0 reintroduces GO-2026-6443, fixed in the 1.83.2 we pin; take
      # the next fixed release instead.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.0"]
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
