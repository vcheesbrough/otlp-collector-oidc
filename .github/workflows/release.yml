name: Release

# Publishes only what CI passed: it runs when CI completes on a push, and only
# on success. scripts/release-plan.sh decides what is published:
#   - a merge of an iteration PR (feat/iteration-N-...) tags vM.N.0 on the
#     merged commit and publishes :edge and :M.N.0;
#   - any other merge to main publishes :edge;
#   - a pushed v* tag publishes that exact version.
# :latest only from 1.0.0 on. The tag is pushed with GITHUB_TOKEN, which
# starts no further workflow: this run is already the release of the commit
# CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, "v*"]

permissions:
  contents: write # push the iteration tag
  packages: write
  pull-requests: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish image
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      # workflow_run runs in the default branch's context: build exactly the
      # commit CI passed, with its tags, not whatever main is now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Merged PR branch
        id: pr
        if: ${{ github.event.workflow_run.head_branch == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Only a branch of this repository can mark an iteration: a fork's
          # branch name is its author's choice.
          branch=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .head.repo.full_name == "${{ github.repository }}")][0].head.ref // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REF: ${{ github.event.workflow_run.head_branch }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          scripts/release-plan.sh | tee -a "$GITHUB_OUTPUT"
      - name: Tag the iteration
        if: ${{ steps.plan.outputs.tag != '' }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" -m "$TAG — $BRANCH"
          git push origin "$TAG"
      - name: Commit time
        id: created
        run: echo "created=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.event.workflow_run.head_sha }}
            CREATED=${{ steps.created.outputs.created }}
          # The multi-arch index carries the labels too: GHCR shows the
          # index's, not each image's. Kept equal to the Dockerfile's by
          # scripts/oci-labels-check.sh.
          annotations: |
            index:org.opencontainers.image.title=otlp-collector-oidc
            index:org.opencontainers.image.description=OpenTelemetry Collector distribution that authenticates OTLP clients with OIDC
            index:org.opencontainers.image.source=https://github.com/vcheesbrough/otlp-collector-oidc
            index:org.opencontainers.image.url=https://github.com/vcheesbrough/otlp-collector-oidc
            index:org.opencontainers.image.documentation=https://github.com/vcheesbrough/otlp-collector-oidc/blob/main/README.md
            index:org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            index:org.opencontainers.image.base.name=docker.io/library/alpine:3.24
            index:org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            index:org.opencontainers.image.created=${{ steps.created.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
