name: Release

# Publishes only what CI passed: it runs when CI completes on a push, and only
# on success. main → :edge; a v* tag → its exact version; :latest only from
# v1.0.0 on.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, "v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish image
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      # workflow_run runs in the default branch's context: build exactly the
      # commit CI passed, with its tags, not whatever main is now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Version and tags
        id: tags
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version=$(scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$HEAD_BRANCH" in
            main)
              tags="$IMAGE:edge" ;;
            v*)
              [ "v$version" = "$HEAD_BRANCH" ] || { echo "tag $HEAD_BRANCH does not match version $version" >&2; exit 1; }
              tags="$IMAGE:$version"
              case "$version" in
                0.*|*-*) ;;
                *) tags="$tags,$IMAGE:latest" ;;
              esac ;;
            *)
              echo "not a release ref: $HEAD_BRANCH" >&2; exit 1 ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
