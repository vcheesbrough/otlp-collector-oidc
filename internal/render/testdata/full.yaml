# Rendered by otlp-collector-oidc run from the environment.
# The variables are documented in docs/configuration.md.

receivers:
  otlpsingleport:
    endpoint: "127.0.0.1:14318"
    max_request_body_size: 1048576
    tls:
      cert_file: "/run/tls/tls.crt"
      key_file: "/run/tls/tls.key"
      reload_interval: "10s"
    cors:
      allowed_origins: ["https://app.example.com", "https://*.example.org"]
      # What an OTLP/HTTP export from a browser sends. rs/cors allows
      # Content-Type implicitly only when this list is empty, so it is listed.
      allowed_headers: ["Authorization", "Content-Type", "Content-Encoding"]
    auth:
      authenticator: oidcclientauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # The payload bounds (bounds.go): a service.name outside
  # ALLOWED_SERVICE_NAMES, or a timestamp older than MAX_PAST_AGE, drops the
  # item after the client has had its 200; the filter's own counters on :8888
  # show what was dropped.
  filter/bounds:
    error_mode: ignore
    traces:
      resource:
        - "not IsString(resource.attributes[\"service.name\"]) or not IsMatch(resource.attributes[\"service.name\"], \"^(?:app-.*|integration)$$\")"
      span:
        - "span.start_time < Now() - Duration(\"48h0m0s\")"
    logs:
      resource:
        - "not IsString(resource.attributes[\"service.name\"]) or not IsMatch(resource.attributes[\"service.name\"], \"^(?:app-.*|integration)$$\")"
      log_record:
        - "log.time_unix_nano != 0 and log.time < Now() - Duration(\"48h0m0s\")"
  # Timestamps further ahead than MAX_FUTURE_SKEW become now.
  transform/bounds:
    error_mode: ignore
    trace_statements:
      - "set(span.start_time, Now()) where span.start_time > Now() + Duration(\"5m0s\")"
      - "set(span.end_time, span.start_time) where span.end_time > Now() + Duration(\"5m0s\") and span.start_time > Now()"
      - "set(span.end_time, Now()) where span.end_time > Now() + Duration(\"5m0s\")"
    log_statements:
      - "set(log.time, Now()) where log.time > Now() + Duration(\"5m0s\")"
  # Identity from the token, on every span and log record (identity.go).
  attributes/identity:
    actions:
      - key: "user.id"
        action: delete
      - key: "user.id"
        action: upsert
        from_context: "auth.user.id"
      - key: "user.name"
        action: delete
      - key: "user.name"
        action: upsert
        from_context: "auth.user.name"
      - key: "user.email"
        action: delete
      - key: "user.email"
        action: upsert
        from_context: "auth.user.email"
      - key: "user.full_name"
        action: delete
      - key: "user.full_name"
        action: upsert
        from_context: "auth.user.full_name"
  # No identity on the resource but the token's (on the spans and records),
  # and the deployment's static attributes over the client's.
  resource/identity:
    attributes:
      - key: "user.id"
        action: delete
      - key: "user.name"
        action: delete
      - key: "user.email"
        action: delete
      - key: "user.full_name"
        action: delete
  # The client metrics chain (metrics.go): no identity action at all.
  filter/metrics:
    error_mode: ignore
    metrics:
      resource:
        - "not IsString(resource.attributes[\"service.name\"]) or not IsMatch(resource.attributes[\"service.name\"], \"^(?:app-.*|integration)$$\")"
      metric:
        - "not IsMatch(metric.name, \"^(?:app\\\\.(requests|latency))$$\")"
  transform/metrics:
    error_mode: ignore
    metric_statements:
      - "keep_keys(resource.attributes, [\"service.name\", \"service.version\"])"
      - "keep_keys(datapoint.attributes, [\"http.route\", \"status\"])"
      - "keep_keys(scope.attributes, [])"
      - "keep_keys(metric.metadata, [])"
      - "set(datapoint.exemplars, nil)"
  deltatocumulative:
    max_streams: 500
    max_stale: "1m0s"
  batch:
    timeout: "200ms"

exporters:
  otlp_grpc:
    endpoint: "upstream.example.com:4317"
    tls:
      insecure: false
      insecure_skip_verify: false
    timeout: "10s"
    compression: "gzip"
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: "5s"
      max_elapsed_time: "1m0s"
      max_interval: "30s"

extensions:
  health_check:
    endpoint: "0.0.0.0:13134"
  oidcclientauth:
    issuer_url: "https://idp.example.com/"
    audience: "aud-1"
    discovery_retry: "5s"
    jwks_refresh: "1h0m0s"
    required_scope: "otlp:send"
    required_claims: ["sub", "email"]
    claim_attributes:
      "sub": "user.id"
      "preferred_username": "user.name"
      "email": "user.email"
      "name": "user.full_name"
    clock_skew: "0s"
    rejection_log_interval: "10s"

service:
  extensions: [health_check, oidcclientauth]
  telemetry:
    # The process's own identity, on its logs and on target_info at :8888.
    # service.version is the build's, which the collector adds itself.
    resource:
      "service.name": "collector-eu"
      "deployment.environment.name": "prod"
      "host.name": "edge 1"
    logs:
      level: "debug"
      encoding: "console"
      output_paths: ["stdout"]
      error_output_paths: ["stderr"]
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "127.0.0.1"
                port: 9888
  pipelines:
    traces:
      receivers: [otlpsingleport]
      processors: [memory_limiter, filter/bounds, transform/bounds, attributes/identity, resource/identity, batch]
      exporters: [otlp_grpc]
    logs:
      receivers: [otlpsingleport]
      processors: [memory_limiter, filter/bounds, transform/bounds, attributes/identity, resource/identity, batch]
      exporters: [otlp_grpc]
    metrics:
      receivers: [otlpsingleport]
      processors: [memory_limiter, filter/metrics, transform/metrics, deltatocumulative, batch]
      exporters: [otlp_grpc]
