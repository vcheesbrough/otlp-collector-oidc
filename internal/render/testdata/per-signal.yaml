# Rendered by otlp-collector-oidc run from the environment.
# The variables are documented in docs/configuration.md.

receivers:
  otlpsingleport:
    endpoint: "0.0.0.0:4318"
    max_request_body_size: 4194304
    tls:
      cert_file: "/etc/otlp-collector-oidc/tls/cert.pem"
      key_file: "/etc/otlp-collector-oidc/tls/key.pem"
      reload_interval: "1m0s"
    auth:
      authenticator: oidcclientauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  # The payload bounds (bounds.go): a service.name outside
  # ALLOWED_SERVICE_NAMES, or a timestamp older than MAX_PAST_AGE, drops the
  # item after the client has had its 200; the filter's own counters on :8888
  # show what was dropped.
  filter/bounds:
    error_mode: ignore
    traces:
      resource:
        - "not IsString(resource.attributes[\"service.name\"]) or not IsMatch(resource.attributes[\"service.name\"], \"^(?:app-.*|integration)$$\")"
      span:
        - "span.start_time < Now() - Duration(\"48h0m0s\")"
    logs:
      resource:
        - "not IsString(resource.attributes[\"service.name\"]) or not IsMatch(resource.attributes[\"service.name\"], \"^(?:app-.*|integration)$$\")"
      log_record:
        - "log.time_unix_nano != 0 and log.time < Now() - Duration(\"48h0m0s\")"
  # Timestamps further ahead than MAX_FUTURE_SKEW become now.
  transform/bounds:
    error_mode: ignore
    trace_statements:
      - "set(span.start_time, Now()) where span.start_time > Now() + Duration(\"5m0s\")"
      - "set(span.end_time, span.start_time) where span.end_time > Now() + Duration(\"5m0s\") and span.start_time > Now()"
      - "set(span.end_time, Now()) where span.end_time > Now() + Duration(\"5m0s\")"
    log_statements:
      - "set(log.time, Now()) where log.time > Now() + Duration(\"5m0s\")"
  # Identity from the token, on every span and log record (identity.go).
  attributes/identity:
    actions:
      - key: "user.id"
        action: delete
      - key: "user.id"
        action: upsert
        from_context: "auth.user.id"
      - key: "user.name"
        action: delete
      - key: "user.name"
        action: upsert
        from_context: "auth.user.name"
      - key: "user.email"
        action: delete
      - key: "user.email"
        action: upsert
        from_context: "auth.user.email"
      - key: "user.full_name"
        action: delete
      - key: "user.full_name"
        action: upsert
        from_context: "auth.user.full_name"
  # No identity on the resource but the token's (on the spans and records),
  # and the deployment's static attributes over the client's.
  resource/identity:
    attributes:
      - key: "user.id"
        action: delete
      - key: "user.name"
        action: delete
      - key: "user.email"
        action: delete
      - key: "user.full_name"
        action: delete
  # The client metrics chain (metrics.go): no identity action at all.
  filter/metrics:
    error_mode: ignore
    metrics:
      resource:
        - "not IsString(resource.attributes[\"service.name\"]) or not IsMatch(resource.attributes[\"service.name\"], \"^(?:app-.*|integration)$$\")"
      metric:
        - "true"
  transform/metrics:
    error_mode: ignore
    metric_statements:
      - "keep_keys(resource.attributes, [\"service.name\", \"service.version\"])"
      - "keep_keys(datapoint.attributes, [])"
      - "keep_keys(scope.attributes, [])"
      - "keep_keys(metric.metadata, [])"
      - "set(datapoint.exemplars, nil)"
  deltatocumulative:
    max_streams: 2000
    max_stale: "10m0s"
  batch:
    timeout: "5s"

exporters:
  otlp_grpc/traces:
    endpoint: "tempo.example.com:4317"
    tls:
      insecure: false
      insecure_skip_verify: true
      ca_file: "/run/upstream/ca.pem"
      cert_file: "/run/upstream/client.pem"
      key_file: "/run/upstream/client-key.pem"
    headers:
      - name: "authorization"
        value: "Bearer abc"
      - name: "x-tenant"
        value: "a"
    timeout: "2.5s"
    compression: "none"
    sending_queue:
      queue_size: 50
    retry_on_failure:
      enabled: true
      initial_interval: "5s"
      max_elapsed_time: "5m0s"
      max_interval: "30s"
  otlp_http/logs:
    logs_endpoint: "http://loki.example.com:3100/otlp/v1/logs"
    tls:
      insecure: true
    headers:
      - name: "x-scope-orgid"
        value: "b"
    timeout: "2.5s"
    compression: "none"
    sending_queue:
      queue_size: 50
    retry_on_failure:
      enabled: true
      initial_interval: "5s"
      max_elapsed_time: "5m0s"
      max_interval: "30s"
  otlp_grpc/metrics:
    endpoint: "mimir.example.com:4317"
    tls:
      insecure: true
    headers:
      - name: "authorization"
        value: "Bearer abc"
      - name: "x-tenant"
        value: "a"
    timeout: "2.5s"
    compression: "none"
    sending_queue:
      queue_size: 50
    retry_on_failure:
      enabled: true
      initial_interval: "5s"
      max_elapsed_time: "5m0s"
      max_interval: "30s"

extensions:
  health_check:
    endpoint: "127.0.0.1:13133"
  oidcclientauth:
    issuer_url: "https://idp.example.com/"
    audience: "telemetry"
    discovery_retry: "30s"
    jwks_refresh: "10m0s"
    required_scope: "telemetry:write"
    required_claims: ["sub", "preferred_username"]
    claim_attributes:
      "sub": "user.id"
      "preferred_username": "user.name"
      "email": "user.email"
      "name": "user.full_name"
    clock_skew: "1m0s"
    rejection_log_interval: "1m0s"

service:
  extensions: [health_check, oidcclientauth]
  telemetry:
    # The process's own identity, on its logs and on target_info at :8888.
    # service.version is the build's, which the collector adds itself.
    resource:
      "service.name": "otlp-collector-oidc"
    logs:
      level: "info"
      encoding: "json"
      output_paths: ["stdout"]
      error_output_paths: ["stderr"]
      # Own logs to the logs upstream (LOG_OUTPUT), as the SDK's schema has it.
      processors: [{"batch":{"exporter":{"otlp":{"protocol":"http/protobuf","endpoint":"http://loki.example.com:3100/otlp/v1/logs","insecure":true,"headers":[{"name":"x-scope-orgid","value":"b"}],"compression":"none","timeout":2500}}}}]
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlpsingleport]
      processors: [memory_limiter, filter/bounds, transform/bounds, attributes/identity, resource/identity, batch]
      exporters: [otlp_grpc/traces]
    logs:
      receivers: [otlpsingleport]
      processors: [memory_limiter, filter/bounds, transform/bounds, attributes/identity, resource/identity, batch]
      exporters: [otlp_http/logs]
    metrics:
      receivers: [otlpsingleport]
      processors: [memory_limiter, filter/metrics, transform/metrics, deltatocumulative, batch]
      exporters: [otlp_grpc/metrics]
