# Rendered by otlp-collector-oidc run from the environment.
# The variables are documented in docs/configuration.md.

receivers:
  otlpsingleport:
    endpoint: "0.0.0.0:4318"
    max_request_body_size: 4194304
    tls:
      cert_file: "/etc/otlp-collector-oidc/tls/cert.pem"
      key_file: "/etc/otlp-collector-oidc/tls/key.pem"
      reload_interval: "1m0s"
    auth:
      authenticator: oidcclientauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  # Identity from the token, on every span and log record (identity.go).
  attributes/identity:
    actions:
      - key: "user.id"
        action: delete
      - key: "user.id"
        action: upsert
        from_context: "auth.user.id"
      - key: "user.name"
        action: delete
      - key: "user.name"
        action: upsert
        from_context: "auth.user.name"
      - key: "user.email"
        action: delete
      - key: "user.email"
        action: upsert
        from_context: "auth.user.email"
      - key: "user.full_name"
        action: delete
      - key: "user.full_name"
        action: upsert
        from_context: "auth.user.full_name"
  batch:
    timeout: "5s"

exporters:
  otlp_grpc/traces:
    endpoint: "tempo.example.com:4317"
    tls:
      insecure: false
      insecure_skip_verify: false
    timeout: "10s"
    compression: "gzip"
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: "5s"
      max_elapsed_time: "1m0s"
      max_interval: "30s"
  otlp_http/logs:
    logs_endpoint: "https://loki.example.com/otlp/v1/logs"
    tls:
      insecure: false
      insecure_skip_verify: false
    headers:
      - name: "X-Scope-OrgID"
        value: "tenant-1"
    timeout: "10s"
    compression: "gzip"
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: "5s"
      max_elapsed_time: "1m0s"
      max_interval: "30s"

extensions:
  health_check:
    endpoint: "127.0.0.1:13133"
  oidcclientauth:
    issuer_url: "https://idp.example.com/"
    audience: "telemetry"
    discovery_retry: "30s"
    jwks_refresh: "10m0s"
    required_scope: "telemetry:write"
    required_claims: ["sub", "preferred_username"]
    claim_attributes:
      "sub": "user.id"
      "preferred_username": "user.name"
      "email": "user.email"
      "name": "user.full_name"
    clock_skew: "1m0s"
    rejection_log_interval: "1m0s"

service:
  extensions: [health_check, oidcclientauth]
  telemetry:
    # The process's own identity, on its logs and on target_info at :8888.
    # service.version is the build's, which the collector adds itself.
    resource:
      "service.name": "collector-eu"
      "team": "obs"
    logs:
      level: "info"
      encoding: "json"
      output_paths: []
      error_output_paths: ["stderr"]
      # Own logs to the logs upstream (LOG_OUTPUT), as the SDK's schema has it.
      processors: [{"batch":{"exporter":{"otlp":{"protocol":"http/protobuf","endpoint":"https://loki.example.com/otlp/v1/logs","headers":[{"name":"X-Scope-OrgID","value":"tenant-1"}],"compression":"gzip","timeout":10000}}}}]
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlpsingleport]
      processors: [memory_limiter, attributes/identity, batch]
      exporters: [otlp_grpc/traces]
    logs:
      receivers: [otlpsingleport]
      processors: [memory_limiter, attributes/identity, batch]
      exporters: [otlp_http/logs]
