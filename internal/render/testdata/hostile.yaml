# Rendered by otlp-collector-oidc run from the environment.
# The variables are documented in docs/configuration.md.

receivers:
  otlpsingleport:
    endpoint: "0.0.0.0:4318"
    max_request_body_size: 4194304
    tls:
      cert_file: "/etc/otlp-collector-oidc/tls/cert.pem"
      key_file: "/etc/otlp-collector-oidc/tls/key.pem"
      reload_interval: "1m0s"
    auth:
      authenticator: oidcclientauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  batch:
    timeout: "5s"

exporters:
  otlp_grpc:
    endpoint: "collector:4317"
    tls:
      insecure: true
    headers:
      - name: "x-a"
        value: "\"$${env:HOME} # exporters: {}"
    timeout: "10s"
    compression: "gzip"
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: "5s"
      max_elapsed_time: "1m0s"
      max_interval: "30s"

extensions:
  health_check:
    endpoint: "127.0.0.1:13133"
  oidcclientauth:
    issuer_url: "https://idp.example.com/?a=$${env:HOME}"
    audience: "a\"b\nexporters: {}"
    discovery_retry: "30s"
    jwks_refresh: "10m0s"
    required_scope: "$$$${x}$$"
    required_claims: ["sub", "'quoted'", "#hash"]
    clock_skew: "1m0s"
    rejection_log_interval: "1m0s"

service:
  extensions: [health_check, oidcclientauth]
  telemetry:
    # The process's own identity, on its logs and on target_info at :8888.
    # service.version is the build's, which the collector adds itself.
    resource:
      "service.name": "otlp-collector-oidc"
      "a\"b$${x}#: {}": "$${env:HOME}"
    logs:
      level: "info"
      encoding: "json"
      output_paths: ["stdout"]
      error_output_paths: ["stderr"]
      # Own logs to the logs upstream (LOG_OUTPUT), as the SDK's schema has it.
      processors: [{"batch":{"exporter":{"otlp":{"protocol":"grpc","endpoint":"http://collector:4317","insecure":true,"headers":[{"name":"x-a","value":"\"$${env:HOME} # exporters: {}"}],"compression":"gzip","timeout":10000}}}}]
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlpsingleport]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
    logs:
      receivers: [otlpsingleport]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
