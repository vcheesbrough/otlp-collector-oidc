# The shipped pipeline. Every value a deployer may change is an environment
# variable with its default after ":-"; README "Configuration" lists them.
#
# Every request is authenticated by oidcclientauth before it is dispatched.
# Traces and logs: otlpsingleport → memory_limiter → batch → otlp_grpc.
# Metrics have no pipeline yet, so the receiver answers 404 / Unimplemented
# for them until the bounded metrics pipeline lands.

receivers:
  otlpsingleport:
    endpoint: ${env:LISTEN_ADDR:-0.0.0.0:4318}
    max_request_body_size: ${env:MAX_REQUEST_BODY_BYTES:-4194304}
    tls:
      cert_file: ${env:TLS_CERT_FILE:-/etc/otlp-collector-oidc/tls/cert.pem}
      key_file: ${env:TLS_KEY_FILE:-/etc/otlp-collector-oidc/tls/key.pem}
    auth:
      authenticator: oidcclientauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:MEMORY_LIMIT_MIB:-64}
    spike_limit_mib: ${env:MEMORY_SPIKE_LIMIT_MIB:-16}
  batch:
    timeout: ${env:BATCH_TIMEOUT:-5s}

exporters:
  otlp_grpc:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    # Temporary: upstream is plaintext gRPC until upstream TLS lands.
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: ${env:HEALTH_ADDR:-127.0.0.1:13133}
  # Claims, their attributes and the static resource attributes keep their
  # defaults until the renderer can turn lists and maps into YAML.
  oidcclientauth:
    issuer_url: ${env:OIDC_ISSUER_URL}
    audience: ${env:OIDC_AUDIENCE}
    discovery_retry: ${env:OIDC_DISCOVERY_RETRY:-30s}
    jwks_refresh: ${env:OIDC_JWKS_REFRESH:-10m}
    required_scope: ${env:REQUIRED_SCOPE:-telemetry:write}
    clock_skew: ${env:CLOCK_SKEW:-60s}
    rejection_log_interval: ${env:REJECTION_LOG_INTERVAL:-60s}

service:
  extensions: [health_check, oidcclientauth]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlpsingleport]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
    logs:
      receivers: [otlpsingleport]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
